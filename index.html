<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are we emoji yet? - SerenityOS Style</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292e;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 10px 0 5px 0;
            color: #1b1f23;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #586069;
            margin-bottom: 12px;
        }

        /* 📈 進捗件数テキスト */
        .emoji-count {
            font-size: 1rem;
            font-weight: 600;
            color: #0366d6;
        }

        /* 📊 進捗バーエリア */
        .controls-container {
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 24px;
            background-color: #e1e4e8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #28a745;
            width: 0%; /* JSで動的計算 */
            transition: width 0.4s ease;
        }

        .progress-percent {
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 60px;
            text-align: right;
        }

        /* 📦 絵文字グリッド（コンパクト表示） */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 6px;
            width: 100%;
            max-width: 900px;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            text-decoration: none;
            transition: transform 0.15s ease, filter 0.15s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .grid-item:hover {
            transform: scale(1.15);
            z-index: 10;
        }

        .grid-item:active {
            transform: scale(0.95);
        }

        /* 未完成（画像なし）背景色：完全な無地 */
        .grid-item.not-ready {
            background-color: #ffcdd2;
        }

        /* 完成（絵文字・画像あり）背景色 */
        .grid-item.ready {
            background-color: #dcedc8;
        }

        .grid-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <h1>Are we emoji yet?</h1>
        <div class="subtitle">自作オープンソース絵文字 進捗トラッカー</div>
        <div class="emoji-count" id="emoji-count-text">Emoji 0 / 0 📈</div>
    </header>

    <div class="controls-container">
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <span class="progress-percent" id="progress-percent">0%</span>
        </div>
    </div>

    <div class="grid-container" id="emoji-grid">
        <!-- 📸 未作成項目 (not-ready: 文字・属性なし) -->
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/1.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/2.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/3.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/4.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/5.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/6.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/7.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/8.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/9.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/10.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/11.png" class="grid-image" alt="" onerror="this.remove()">
        </a>
        <a class="grid-item not-ready" href="https://emojipedia.org" target="_blank">
            <img src="images/12.png" class="grid-image" alt="" onerror="this.remove()">
        </a>

        <!-- 🌟 完成項目 (ready) -->
        <a class="grid-item ready" href="https://emojipedia.org" target="_blank">😂</a>
        <a class="grid-item ready" href="https://emojipedia.org" target="_blank">🔥</a>
        <a class="grid-item ready" href="https://emojipedia.org" target="_blank">🍀</a>
        <a class="grid-item ready" href="https://emojipedia.org" target="_blank">🧸</a>
        <a class="grid-item ready" href="https://emojipedia.org" target="_blank">🍩</a>
    </div>

    <script>
        // 📊 進捗の自動計算
        function updateProgress() {
            const total = document.querySelectorAll('.grid-item').length;
            const ready = document.querySelectorAll('.grid-item.ready').length;
            const percentage = total > 0 ? ((ready / total) * 100).toFixed(1) : 0;

            document.getElementById('emoji-count-text').innerText = `Emoji ${ready} / ${total} 📈`;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
            document.getElementById('progress-percent').innerText = `${percentage}%`;
        }

        // 初期ロード時に計算を実行
        window.onload = updateProgress;
    </script>
</body>
</html>
